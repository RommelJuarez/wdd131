<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <meta name="author" content="Rommel Juarez">
    <meta name="description" content="Rommel Juarez WDD 131 - W05 Assignment: Product Review Form">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review Form</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
                <!-- Las opciones se generarán dinámicamente aquí -->
            </select>

            <label>Overall Rating</label>
            <div id="rating">
                <input type="radio" id="star1" name="rating" value="1" required>
                <label for="star1">☆</label>
                <input type="radio" id="star2" name="rating" value="2" required>
                <label for="star2">☆</label>
                <input type="radio" id="star3" name="rating" value="3" required>
                <label for="star3">☆</label>
                <input type="radio" id="star4" name="rating" value="4" required>
                <label for="star4">☆</label>
                <input type="radio" id="star5" name="rating" value="5" required>
                <label for="star5">☆</label>
            </div>

            <label for="installation-date">Date of Installation</label>
            <input type="date" id="installation-date" name="installation-date" required>

            <label>Useful Features</label>
            <div id="features">
                <input type="checkbox" id="feature1" name="features" value="Feature 1">
                <label for="feature1">Feature 1</label>
                <input type="checkbox" id="feature2" name="features" value="Feature 2">
                <label for="feature2">Feature 2</label>
                <input type="checkbox" id="feature3" name="features" value="Feature 3">
                <label for="feature3">Feature 3</label>
            </div>

            <label for="review">Written Review</label>
            <textarea id="review" name="review"></textarea>

            <label for="username">User Name</label>
            <input type="text" id="username" name="username">

            <input type="submit" value="Submit Review">
        </form>
    </main>
    <footer>
        <p>&copy; 2024 Product Reviews</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
